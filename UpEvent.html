<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upc-events</title>

  <link rel="stylesheet" href="UpEvent.css">
  <link rel="stylesheet" href="navbar.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <!-- Leaflet lazy CSS -->
  <link
    rel="preload"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
    as="style"
    onload="this.onload=null;this.rel='stylesheet'"
  >
  <noscript>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  </noscript>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
</head>

<body>
  <main>
  <div id="navbar"></div>

     <div class="map-container">
  
      <div class="uper-text">
         🗺️ Skateparks in Costa Rica.
        This section will show skateparks near your location.
        If you are offline, the map will still display saved skateparks near you.
      </div>

  <div id="map"></div>

  <div class="option-button">
    <div class="slide-buttons">
      <button class="route" id="btn-1">Nearby skateparks</button>
      <button class="alternative" id="btn-2">Alternative Routes</button>
    </div>
  </div>

</div>

<button id="events-btn" class="floating-btn">Events</button>

<div id="events-panel">

  <h2>Upcoming Competitions</h2>

  <div id="events-list"></div>

</div>

 </main> 

<!-- Leaflet FIRST -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- App AFTER Leaflet -->
<script type="module" src="./mapInit.js"></script>

<!-- Other scripts -->
<script type="module" src="./navbar.js"></script>
<script type="module" src="events.js"></script>
<script type="module" src="./app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      const reg =
        await navigator.serviceWorker.register("./service-worker.js");

      console.log("SW registered:", reg.scope);
      reg.update();
    } catch (err) {
      console.log("SW error:", err);
    }
  });
}
</script>

  </body> 
</html>
