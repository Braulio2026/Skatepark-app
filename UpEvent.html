<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upc-events</title>

  <link rel="stylesheet" href="UpEvent.css">
  <link rel="stylesheet" type="text/css" href="navbar.css">

  <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
</head>

<body>
   <main>
    <div id="navbar"></div>

      <div class="map-container">
          <h2>
             🗺️ Skateparks in Costa Rica. 
             This section will show skateparks near your location. 
             If you are offline, the map will still display saved skateparks near you.
          </h2>

        <div id="map"></div>  

        <div class="option-button">
          <div class="slide-buttons">
            <button class="route" id="btn-1">Nearby skateparks</button>
            <button class="alternative" id="btn-2">Alternative Routes</button>
          </div>
        </div>

       </div>

      <div class="container-list">
        <div class="text">
          <div class="column-1">
             <ul id="name-event" class="Name">
              <h3>Upcoming events will be aviable here</h3>
              <li>Upcoming challenges.</li>
             </ul>
          </div>

          <div class="column-2">
             <ul id="schedule-event" class="Schedule">
              <h3>Schedule will keeps here</h3>
              <li>available soom</li>
             </ul>
          </div>
        </div>
      </div>

</main> 
 <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
 <script src="navbar.js"></script>
 <script src="app.js"></script>
 <script>
   if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker.register("/service-worker.js")
      .then(reg => console.log("Service Worker registered:", reg.scope))
      .catch(err => console.log("Service Worker error:", err));

  });

}
</script>
  </body> 
</html>
