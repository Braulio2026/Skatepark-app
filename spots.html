<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Community Spots</title>

  <link rel="stylesheet" href="spots.css">
  <link rel="stylesheet" href="navbar.css">
</head>

<body>

  <main class="community-page">

    <div id="navbar"></div>

    <!-- HEADER -->

    <section class="community-header">
      <h1>Community Spots</h1>
      <p>Discover spots shared by local skaters.</p>
    </section>

    <!-- FORM -->

     <form id="spotForm" class="event-form-container">

  <h3>Share a New Spot</h3>

  <label for="spot-location">
    Spot Location
  </label>

  <input
    type="text"
    id="spot-location"
    placeholder="Google Maps link"
    required
  >

  <label for="spot-description">
    Spot Description
  </label>

  <textarea
    id="spot-description"
    placeholder="Describe the spot..."
    required
  ></textarea>

  <!-- Hidden file input -->
  <input
    type="file"
    id="spot-image"
    accept="image/*"
    style="display:none;"
  >

  <!-- Custom Upload Button -->
  <label
    for="spot-image"
    class="file-upload"
  >
    Upload Image
  </label>

  <span id="spot-file-name">
    No file selected
  </span>

  <button type="submit">
    Share Spot
  </button>

</form>

    <!-- SUPABASE POSTS LOAD HERE -->

    <section id="community-spots">
      <!-- Cards inserted automatically by spots.js -->
    </section>
  
    <footer class="footer">
      <p>© 2026 Skate Routes Costa Rica</p>

      <nav>
        <a href="index.html">Home</a>
        <a href="skatepark.html">Parks</a>
        <a href="spots.html">Spots</a>
        <a href="UpEvent.html">Events</a>
      </nav>
  </footer>

  </main>

  <script type="module" src="./navbar.js"></script>
  <script type="module" src="./app.js"></script>
  <script type="module" src="./spots.js"></script>

  <script
    src="https://kit.fontawesome.com/b0440afd81.js"
    crossorigin="anonymous">
  </script>

</body>
</html>
