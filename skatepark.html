// SLIDER

document.addEventListener("DOMContentLoaded", () => {

  const container = document.getElementById("skateparks-container");

  skateparks.forEach(park => {

    const slider = document.createElement("div");
    slider.className = "single-carousel";

    slider.innerHTML = `
  <div class="carousel-track">
    ${park.images.map((img, i) => `
      <img class="carousel-image ${i === 0 ? "active" : ""}" src="${img}" alt="${park.name}">
    `).join("")}
  </div>

  <div class="carousel-text">
    <a class="button-map" href="${park.map}">See on map</a>

    <h2>${park.name}</h2>
    <p>${park.description}</p>

    <div class="icons-text">

      <div class="icon-item">
        <svg class="modern-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 21s-6-5.5-6-10a6 6 0 1 1 12 0c0 4.5-6 10-6 10z"/>
          <circle cx="12" cy="11" r="2.5"/>
        </svg>
        <p>${park.address}</p>
      </div>

      <div class="icon-item">
        <svg class="modern-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 6h5l3 6h5l3-6h2"/>
          <circle cx="5" cy="6" r="1.5"/>
          <circle cx="19" cy="6" r="1.5"/>
        </svg>
        <p>${park.directions}</p>
      </div>

      <div class="icon-item">
        <svg class="modern-icon" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" fill="#FFF" stroke="#3F9AFF" stroke-width="1.5"/>
          <path d="M12 7v5l3 2" stroke="#3F9AFF" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="1.5" fill="#FF4D6D"/>
        </svg>
        <p>${park.schedule}</p>
      </div>

    </div>
  </div>

  <div class="carousel-controls">
    <button class="carousel-btn prev">❮</button>
    <button class="carousel-btn next">❯</button>
  </div>
`;

    container.appendChild(slider);

    // SLIDER LOGIC (attached immediately)

    const images = slider.querySelectorAll(".carousel-image");
    const nextBtn = slider.querySelector(".next");
    const prevBtn = slider.querySelector(".prev");

    let index = 0;

    function showImage(i) {
      images.forEach(img => img.classList.remove("active"));
      images[i].classList.add("active");
    }

    if (nextBtn) {
      nextBtn.addEventListener("click", () => {
        index = (index + 1) % images.length;
        showImage(index);
      });
    }

    if (prevBtn) {
      prevBtn.addEventListener("click", () => {
        index = (index - 1 + images.length) % images.length;
        showImage(index);
      });
    }

  });

  //  BUTTON MAP (event delegation = BEST way)

  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".button-map");
    if (!btn) return;

    const link = btn.getAttribute("href");
    if (!link) return;

    e.preventDefault();

    btn.classList.add("clicked");

    setTimeout(() => {
      window.location.href = link;
    }, 180);
  });

});

</script>

<script>
  if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker.register("/service-worker.js")
      .then(reg => console.log("Service Worker registered:", reg.scope))
      .catch(err => console.log("Service Worker error:", err));

  });

}

document.querySelectorAll('.button-map').forEach(btn => {
  btn.addEventListener('click', function(e) {
    const link = this.getAttribute('href');
    if (!link) return;

    e.preventDefault();

    this.classList.add('clicked');

    setTimeout(() => {
      window.location.href = link;
    }, 180); // smooth but fast
  });
});
</script>
